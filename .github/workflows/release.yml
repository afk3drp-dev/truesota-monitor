name: Release Build (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Package Release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Release | Out-Null
          Copy-Item "src-tauri\target\release\truesota-tauri.exe" "Release\TrueSOTA_Monitor_Tauri.exe" -Force
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1
          Copy-Item $nsis.FullName "Release\TrueSOTA_Installer.exe" -Force
          Copy-Item $msi.FullName "Release\TrueSOTA_Setup.msi" -Force
          Compress-Archive -Path "Release\TrueSOTA_Installer.exe","Release\TrueSOTA_Setup.msi","Release\README.md" -DestinationPath "Release\TrueSOTA_Monitor_Installers.zip" -Force

      - name: Compute SHA-256 checksums & release body
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash "Release\TrueSOTA_Monitor_Installers.zip" -Algorithm SHA256).Hash
          $exeHash = (Get-FileHash "Release\TrueSOTA_Monitor_Tauri.exe" -Algorithm SHA256).Hash
          $zipSize = [Math]::Round((Get-Item "Release\TrueSOTA_Monitor_Installers.zip").Length / 1MB, 2)
          $exeSize = [Math]::Round((Get-Item "Release\TrueSOTA_Monitor_Tauri.exe").Length / 1MB, 2)
          @(
            "## Скачать для Windows 10 / 11 (x64)"
            ""
            "| Файл | Назначение | Размер | SHA-256 |"
            "| :--- | :--- | :--- | :--- |"
            "| ``TrueSOTA_Monitor_Installers.zip`` | Установщики ``NSIS`` + ``MSI`` + ``README.md`` (**рекомендуется**) | $zipSize MB | ``$zipHash`` |"
            "| ``TrueSOTA_Monitor_Tauri.exe`` | Переносной Portable ``.exe`` без установки | $exeSize MB | ``$exeHash`` |"
            ""
            "<details>"
            "<summary>Проверка целостности в PowerShell</summary>"
            ""
            '```powershell'
            "Get-FileHash .\TrueSOTA_Monitor_Installers.zip -Algorithm SHA256"
            "Get-FileHash .\TrueSOTA_Monitor_Tauri.exe -Algorithm SHA256"
            '```'
            ""
            "</details>"
            ""
            "---"
          ) | Set-Content -Path "Release\RELEASE_NOTES.md" -Encoding UTF8

      - name: Check existing release assets
        id: check_release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_release.outputs.has_assets != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: Release/RELEASE_NOTES.md
          files: |
            Release/TrueSOTA_Monitor_Installers.zip
            Release/TrueSOTA_Monitor_Tauri.exe
