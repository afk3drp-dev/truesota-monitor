name: Release Build (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Package Release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Release | Out-Null
          Copy-Item "src-tauri\target\release\truesota-tauri.exe" "Release\TrueSOTA_Monitor_Tauri.exe" -Force
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1
          Copy-Item $nsis.FullName "Release\TrueSOTA_Installer.exe" -Force
          Copy-Item $msi.FullName "Release\TrueSOTA_Setup.msi" -Force
          Compress-Archive -Path "Release\TrueSOTA_Installer.exe","Release\TrueSOTA_Setup.msi","Release\README.md" -DestinationPath "Release\TrueSOTA_Monitor_Installers.zip" -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Release/TrueSOTA_Monitor_Installers.zip
            Release/TrueSOTA_Monitor_Tauri.exe
