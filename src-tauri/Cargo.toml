[package]
name = "truesota-tauri"
version = "1.2.0"
description = "TrueSOTA Usage Monitor"
authors = ["afk3drp"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "truesota_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json", "tls"] }
window-vibrancy = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Win32_System_Com"] }

[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = true
